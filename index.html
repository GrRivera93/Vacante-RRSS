<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="Horario_imagen.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encargados Fin de Semana</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* TODOS TUS ESTILOS CSS SE MANTIENEN IGUALES */

  </style>
</head>
<body>
  <div class="container">
    <h1>Encargados Fin de Semana <span class="emoji">🗓️</span></h1>
    
    <div class="panel" id="panelWeekend">
        <button class="capture-button" onclick="copyPanelToClipboard('panelWeekend', 'Encargados fin de semana')" title="Copiar imagen">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v8H8V8zm2 2v4h4v-4h-4z"/></svg>
        </button>
        <h2>Encargados Fin de Semana <span class="emoji">👨‍💻</span></h2>
        <div class="date-range" id="weekendDates"></div>
        
        <div class="shift-info">
            <div class="shift-day"><span class="emoji">📆</span> Sábado: <span class="person-name" id="saturdayName"></span></div>
            <div class="shift-day"><span class="emoji">🗓️</span> Domingo: <span class="person-name" id="sundayName"></span></div>
            <div class="shift-day rest-day"><span class="emoji">🏖️</span> Descansa: <span class="person-name" id="restingName"></span></div>
            <div class="shift-day vacation-day" id="vacationInfo" style="display: none;"><span class="emoji">✈️</span> De vacaciones: <span class="person-name vacation" id="vacationName"></span></div>
        </div>
    </div>

    <div class="panel" id="panelChanges">
        <button class="capture-button" onclick="copyPanelToClipboard('panelChanges', 'Gestión de vacaciones')" title="Copiar imagen">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v8H8V8zm2 2v4h4v-4h-4z"/></svg>
        </button>
        <h2>Gestión de Vacaciones <span class="emoji">⛱️</span></h2>
        
        <div class="vacation-form">
            <div class="form-group">
                <label for="vacationPerson">Persona:</label>
                <select id="vacationPerson">
                    <option value="Marvin">Marvin</option>
                    <option value="Eli">Eli</option>
                    <option value="Juan">Juan</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="vacationStart">Fecha de inicio:</label>
                <input type="date" id="vacationStart">
            </div>
            
            <div class="form-group">
                <label for="vacationEnd">Fecha de fin:</label>
                <input type="date" id="vacationEnd">
            </div>
            
            <div class="vacation-controls">
                <button class="add-btn" onclick="addVacation()">Agregar Vacaciones</button>
                <button class="clear-btn" onclick="clearVacations()">Limpiar Todo</button>
            </div>
        </div>
        
        <div class="vacation-section">
            <h3>Vacaciones Programadas <span aria-hidden="true">📅</span></h3>
            <ul class="vacation-list" id="vacationList">
                <!-- Las vacaciones se cargarán dinámicamente -->
            </ul>
        </div>
    </div>
    
    <div class="panel" id="panelFeedback">
        <button class="capture-button" onclick="copyPanelToClipboard('panelFeedback', 'Retroalimentaciones')" title="Copiar imagen">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v8H8V8zm2 2v4h4v-4h-4z"/></svg>
        </button>
        <h2>Retroalimentaciones <span class="emoji">💬</span></h2>
        <div class="date-range" id="feedbackDates"></div>
        
        <div class="feedback-info">
            <div class="feedback-item"><span class="emoji">⬅️</span> <strong>Retro:</strong> <span id="lastFeedback"></span></div>
            <div class="feedback-item"><span class="emoji">🔜</span> <strong>Próxima Retro:</strong> <span id="nextFeedback"></span></div>
        </div>
    </div>

    <div class="panel" id="panelActions">
        <button class="capture-button" onclick="copyPanelToClipboard('panelActions', 'Cambios manuales')" title="Copiar imagen">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v8H8V8zm2 2v4h4v-4h-4z"/></svg>
        </button>
        <div class="changes-section">
            <h3>Realizar cambios: <span class="emoji">✏️</span></h3>
            <div class="change-form">
                <div class="form-group">
                    <label for="saturdayWorker">Sábado trabaja:</label>
                    <input type="text" id="saturdayWorker" placeholder="Nombre del encargado">
                </div>
                <div class="form-group">
                    <label for="sundayWorker">Domingo trabaja:</label>
                    <input type="text" id="sundayWorker" placeholder="Nombre del encargado">
                </div>
                <button class="save-btn" onclick="saveManualChanges()">Guardar Cambios <span class="emoji">💾</span></button>
            </div>
        </div>
        
        <div class="changes-section">
            <h3>Resumen Semanal: <span class="emoji">📈</span></h3>
            <ul class="summary-list" id="weeklySummary">
                <!-- El resumen se cargará dinámicamente -->
            </ul>
        </div>
    </div>

  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // 🔥 CONFIGURACIÓN DE FIREBASE (TUS CREDENCIALES)
    const firebaseConfig = {
      apiKey: "AIzaSyCMWCHyrPNJ7WIjKCYau8A0WeM-ZSCxWXQ",
      authDomain: "vacantes-2950b.firebaseapp.com",
      databaseURL: "https://vacantes-2950b-default-rtdb.firebaseio.com",
      projectId: "vacantes-2950b",
      storageBucket: "vacantes-2950b.firebasestorage.app",
      messagingSenderId: "968104457933",
      appId: "1:968104457933:web:b32bf972181252da295b84"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Variables globales
    const workers = ["Marvin", "Eli", "Juan"];
    const START_DATE = new Date(2025, 0, 4);
    const ROTATION_PATTERN = [
        { sat: "Eli", sun: "Juan", rest: "Marvin" },
        { sat: "Marvin", sun: "Eli", rest: "Juan" },
        { sat: "Juan", sun: "Marvin", rest: "Eli" }
    ];
    const LAST_RETRO_DATE = new Date(2025, 8, 19);
    const LAST_RETRO_PERSON = "Juan";
    const RETRO_ROTATION = ["Juan", "Eli", "Marvin"];

    let vacationData = [];
    let manualAssignment = null;
    let isInitialLoad = true;

    // ============ FUNCIONES DE FIREBASE ============

    // Cargar vacaciones desde Firebase
    function loadVacationsFromFirebase() {
      const vacationsRef = database.ref('vacations');
      vacationsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          // Convertir objeto en array si es necesario
          if (Array.isArray(data)) {
            vacationData = data;
          } else {
            // Si es un objeto con claves (push)
            vacationData = Object.values(data);
          }
        } else {
          // Datos iniciales
          vacationData = [
            { person: "Eli", start: "2025-09-28", end: "2025-10-12" },
            { person: "Juan", start: "2025-11-16", end: "2025-11-30" },
            { person: "Marvin", start: "2025-12-07", end: "2025-12-22" }
          ];
          saveVacationsToFirebase();
        }
        updateVacationList();
        updateRotation();
      });
    }

    // Guardar vacaciones en Firebase
    function saveVacationsToFirebase() {
      database.ref('vacations').set(vacationData);
    }

    // Cargar asignación manual desde Firebase
    function loadManualAssignment() {
      const manualRef = database.ref('manualAssignment');
      manualRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          manualAssignment = data;
          // Aplicar la asignación manual
          document.getElementById("saturdayWorker").value = data.saturday || '';
          document.getElementById("sundayWorker").value = data.sunday || '';
          // Actualizar nombres mostrados
          if (data.saturday && data.sunday) {
            const allWorkers = ["Marvin", "Eli", "Juan"];
            const restingPerson = allWorkers.find(person =>
              person !== data.saturday && person !== data.sunday
            ) || "N/A";
            document.getElementById("saturdayName").textContent = data.saturday;
            document.getElementById("sundayName").textContent = data.sunday;
            document.getElementById("restingName").textContent = restingPerson;
            
            // Actualizar resumen
            const summaryList = document.getElementById("weeklySummary");
            summaryList.innerHTML = `
              <li>${restingPerson} tiene fin de semana libre</li>
              <li>Cambio manual aplicado</li>
            `;
          }
        } else {
          manualAssignment = null;
          // Si no hay asignación manual, usar la rotación automática
          if (!isInitialLoad) {
            updateRotation();
          }
        }
        isInitialLoad = false;
      });
    }

    // Guardar asignación manual en Firebase
    function saveManualAssignmentToFirebase(saturday, sunday) {
      database.ref('manualAssignment').set({ saturday, sunday });
    }

    // ============ FUNCIONES DE LA APLICACIÓN ============

    // Función para parsear fechas (CORREGIDA)
    function parseDate(dateString) {
        if (dateString.includes('/')) {
            const [day, month, year] = dateString.split('/').map(Number);
            return new Date(Date.UTC(year, month - 1, day));
        } else {
            const [year, month, day] = dateString.split('-').map(Number);
            return new Date(Date.UTC(year, month - 1, day));
        }
    }

    function formatDate(date) {
        const day = String(date.getUTCDate()).padStart(2, '0');
        const month = String(date.getUTCMonth() + 1).padStart(2, '0');
        const year = date.getUTCFullYear();
        return `${day}/${month}/${year}`;
    }

    function isPersonOnVacation(person, date) {
        for (const vacation of vacationData) {
            if (vacation.person === person) {
                const startDate = parseDate(vacation.start);
                const endDate = parseDate(vacation.end);
                const checkDate = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
                const utcStartDate = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth(), startDate.getUTCDate()));
                const utcEndDate = new Date(Date.UTC(endDate.getUTCFullYear(), endDate.getUTCMonth(), endDate.getUTCDate()));
                utcEndDate.setUTCHours(23, 59, 59, 999);
                
                if (checkDate >= utcStartDate && checkDate <= utcEndDate) {
                    return true;
                }
            }
        }
        return false;
    }

    function getAvailableWorkers(date) {
        return workers.filter(person => !isPersonOnVacation(person, date));
    }

    function calculateRotationForDate(targetSaturday) {
        const timeDiff = targetSaturday.getTime() - START_DATE.getTime();
        let weekDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24 * 7));
        let adjustedWeekDiff = weekDiff;
        
        for (let week = 0; week <= weekDiff; week++) {
            const checkDate = new Date(START_DATE);
            checkDate.setDate(START_DATE.getDate() + (week * 7));
            let hadVacations = false;
            for (const person of workers) {
                if (isPersonOnVacation(person, checkDate)) {
                    hadVacations = true;
                    break;
                }
            }
            if (hadVacations) {
                adjustedWeekDiff--;
            }
        }
        
        adjustedWeekDiff = Math.max(0, adjustedWeekDiff);
        const patternIndex = adjustedWeekDiff % ROTATION_PATTERN.length;
        return {...ROTATION_PATTERN[patternIndex]};
    }

    function adjustRotationForVacations(baseRotation, date) {
        const availableWorkers = getAvailableWorkers(date);
        
        if (availableWorkers.length === 3) {
            return {...baseRotation, adjusted: false};
        }
        
        if (availableWorkers.length === 2) {
            const personOnVacation = workers.find(person => !availableWorkers.includes(person));
            if (baseRotation.rest === personOnVacation) {
                return {
                    sat: baseRotation.sat,
                    sun: baseRotation.sun,
                    rest: personOnVacation,
                    adjusted: true,
                    vacationPerson: personOnVacation
                };
            }
            return {
                sat: availableWorkers[0],
                sun: availableWorkers[1],
                rest: personOnVacation,
                adjusted: true,
                vacationPerson: personOnVacation
            };
        }
        
        if (availableWorkers.length === 1) {
            return {
                sat: availableWorkers[0],
                sun: availableWorkers[0],
                rest: "N/A",
                adjusted: true,
                vacationPerson: workers.filter(person => person !== availableWorkers[0]).join(" y ")
            };
        }
        
        return {
            sat: "N/A",
            sun: "N/A",
            rest: "N/A",
            adjusted: true,
            vacationPerson: "Todos"
        };
    }

    function getNextWeekend() {
      const today = new Date();
      const day = today.getDay();
      const nextSaturday = new Date(today);
      nextSaturday.setDate(today.getDate() + ((6 - day + 7) % 7));
      const nextSunday = new Date(nextSaturday);
      nextSunday.setDate(nextSaturday.getDate() + 1);
      return { saturday: nextSaturday, sunday: nextSunday };
    }

    function getFeedbackInfo(currentSaturday) {
        let lastFeedback = null;
        let nextFeedback = null;
        const currentFriday = new Date(currentSaturday);
        currentFriday.setDate(currentSaturday.getDate() - 1);
        let lastRetroDate = new Date(LAST_RETRO_DATE);
        let lastRetroPerson = LAST_RETRO_PERSON;
        
        while (lastRetroDate <= currentFriday) {
            lastFeedback = { date: new Date(lastRetroDate), person: lastRetroPerson };
            const nextRetroDate = new Date(lastRetroDate);
            nextRetroDate.setDate(lastRetroDate.getDate() + 14);
            const currentIndex = RETRO_ROTATION.indexOf(lastRetroPerson);
            const nextIndex = (currentIndex + 1) % RETRO_ROTATION.length;
            const nextRetroPerson = RETRO_ROTATION[nextIndex];
            lastRetroDate = nextRetroDate;
            lastRetroPerson = nextRetroPerson;
        }
        nextFeedback = { date: lastRetroDate, person: lastRetroPerson };
        return { last: lastFeedback, next: nextFeedback };
    }

    function updateRotation() {
        const { saturday, sunday } = getNextWeekend();
        const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
        
        // Si hay asignación manual, usarla
        if (manualAssignment && manualAssignment.saturday && manualAssignment.sunday) {
            const allWorkers = ["Marvin", "Eli", "Juan"];
            const restingPerson = allWorkers.find(person =>
                person !== manualAssignment.saturday && person !== manualAssignment.sunday
            ) || "N/A";
            
            document.getElementById("weekendDates").textContent = `${saturday.toLocaleDateString('es-ES', options)} - ${sunday.toLocaleDateString('es-ES', options)}`;
            document.getElementById("saturdayName").textContent = manualAssignment.saturday;
            document.getElementById("sundayName").textContent = manualAssignment.sunday;
            document.getElementById("restingName").textContent = restingPerson;
            
            // Ocultar información de vacaciones si hay asignación manual
            document.getElementById("vacationInfo").style.display = "none";
            
            const summaryList = document.getElementById("weeklySummary");
            summaryList.innerHTML = `
                <li>${restingPerson} tiene fin de semana libre</li>
                <li>Cambio manual aplicado</li>
            `;
            
            // Actualizar feedback
            updateFeedback(saturday);
            return;
        }
        
        // Si no hay asignación manual, usar rotación automática
        const baseRotation = calculateRotationForDate(saturday);
        const adjustedRotation = adjustRotationForVacations(baseRotation, saturday);
        
        document.getElementById("weekendDates").textContent = `${saturday.toLocaleDateString('es-ES', options)} - ${sunday.toLocaleDateString('es-ES', options)}`;
        document.getElementById("saturdayName").textContent = adjustedRotation.sat;
        document.getElementById("sundayName").textContent = adjustedRotation.sun;
        document.getElementById("restingName").textContent = adjustedRotation.rest;
        
        const vacationInfo = document.getElementById("vacationInfo");
        const vacationName = document.getElementById("vacationName");
        
        if (adjustedRotation.adjusted) {
            vacationName.textContent = adjustedRotation.vacationPerson;
            vacationInfo.style.display = "flex";
        } else {
            vacationInfo.style.display = "none";
        }
        
        const summaryList = document.getElementById("weeklySummary");
        if (adjustedRotation.adjusted) {
            summaryList.innerHTML = `
                <li>${adjustedRotation.rest} tiene fin de semana libre</li>
                <li>Ajuste por vacaciones de ${adjustedRotation.vacationPerson}</li>
            `;
        } else {
            summaryList.innerHTML = `
                <li>${adjustedRotation.rest} tiene fin de semana libre</li>
                <li>Sin cambios programados esta semana</li>
            `;
        }
        
        updateFeedback(saturday);
    }

    function updateFeedback(saturday) {
        const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
        const feedbackInfo = getFeedbackInfo(saturday);
        
        document.getElementById("feedbackDates").textContent = `${saturday.toLocaleDateString('es-ES', options)} - ${new Date(saturday.getTime() + 86400000).toLocaleDateString('es-ES', options)}`;
        
        if (feedbackInfo.last) {
            document.getElementById("lastFeedback").textContent = `${feedbackInfo.last.person} (${formatDate(feedbackInfo.last.date)})`;
        } else {
            document.getElementById("lastFeedback").textContent = "No hay registro previo";
        }
        
        if (feedbackInfo.next) {
            document.getElementById("nextFeedback").textContent = `${feedbackInfo.next.person} (${formatDate(feedbackInfo.next.date)})`;
        } else {
            document.getElementById("nextFeedback").textContent = "No hay próxima retro programada";
        }
    }

    function updateVacationList() {
        const vacationList = document.getElementById("vacationList");
        vacationList.innerHTML = "";
        
        if (vacationData.length === 0) {
            vacationList.innerHTML = "<li>No hay vacaciones programadas</li>";
            return;
        }
        
        const sortedVacations = [...vacationData].sort((a, b) => 
            new Date(a.start) - new Date(b.start)
        );
        
        sortedVacations.forEach((vacation, index) => {
            const li = document.createElement("li");
            const startDate = parseDate(vacation.start);
            const endDate = parseDate(vacation.end);
            const today = new Date();
            
            const todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
            const startUTC = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth(), startDate.getUTCDate()));
            const endUTC = new Date(Date.UTC(endDate.getUTCFullYear(), endDate.getUTCMonth(), endDate.getUTCDate()));
            
            const isCurrent = todayUTC >= startUTC && todayUTC <= endUTC;
            const isPast = todayUTC > endUTC;
            
            li.innerHTML = `
                <span aria-hidden="true">${isCurrent ? "🏖️" : (isPast ? "✅" : "⛱️")}</span>
                <strong>${vacation.person}:</strong> ${formatDate(startDate)} - ${formatDate(endDate)}
                ${isCurrent ? " <span style='color: var(--vacation-color);'>(En curso)</span>" : ""}
                ${isPast ? " <span style='color: var(--text-light);'>(Finalizada)</span>" : ""}
                <button onclick="removeVacation(${index})" style="margin-left: 10px; background: var(--resting-color); color: white; border: none; border-radius: 4px; padding: 2px 6px; font-size: 0.8em; cursor: pointer;">Eliminar</button>
            `;
            vacationList.appendChild(li);
        });
    }

    // ============ FUNCIONES DE ACCIÓN ============

    function addVacation() {
        const person = document.getElementById('vacationPerson').value;
        const start = document.getElementById('vacationStart').value;
        const end = document.getElementById('vacationEnd').value;
        
        if (!start || !end) {
            showToast('Por favor, selecciona ambas fechas');
            return;
        }
        
        if (new Date(start) > new Date(end)) {
            showToast('La fecha de inicio no puede ser posterior a la fecha de fin');
            return;
        }
        
        // Verificar solapamiento
        const startDate = new Date(start);
        const endDate = new Date(end);
        const overlapping = vacationData.some(v => {
            if (v.person !== person) return false;
            const vStart = new Date(v.start);
            const vEnd = new Date(v.end);
            return (startDate <= vEnd && endDate >= vStart);
        });
        
        if (overlapping) {
            showToast(`${person} ya tiene vacaciones en ese período`);
            return;
        }
        
        vacationData.push({ person, start, end });
        saveVacationsToFirebase();
        showToast(`Vacaciones agregadas para ${person}`);
        document.getElementById('vacationStart').value = '';
        document.getElementById('vacationEnd').value = '';
    }

    function removeVacation(index) {
        const vacation = vacationData[index];
        if (confirm(`¿Eliminar vacaciones de ${vacation.person} (${formatDate(parseDate(vacation.start))} - ${formatDate(parseDate(vacation.end))})?`)) {
            vacationData.splice(index, 1);
            saveVacationsToFirebase();
            showToast('Vacaciones eliminadas');
        }
    }

    function clearVacations() {
        if (confirm('¿Estás seguro de que quieres eliminar todas las vacaciones?')) {
            vacationData = [];
            saveVacationsToFirebase();
            showToast('Todas las vacaciones han sido eliminadas');
        }
    }

    function saveManualChanges() {
        const saturday = document.getElementById("saturdayWorker").value.trim();
        const sunday = document.getElementById("sundayWorker").value.trim();
        
        if (!saturday || !sunday) {
            alert("Por favor, ingresa los nombres de los encargados de sábado y domingo.");
            return;
        }
        
        // Verificar que los nombres sean válidos
        const allWorkers = ["Marvin", "Eli", "Juan"];
        if (!allWorkers.includes(saturday) || !allWorkers.includes(sunday)) {
            alert(`Los nombres deben ser uno de: ${allWorkers.join(", ")}`);
            return;
        }
        
        if (saturday === sunday) {
            alert("El sábado y domingo no pueden ser la misma persona");
            return;
        }
        
        // Guardar en Firebase
        saveManualAssignmentToFirebase(saturday, sunday);
        showToast('Cambios manuales guardados correctamente');
    }

    // ============ FUNCIONES DE UTILIDAD ============

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    async function copyPanelToClipboard(panelId, panelName) {
        const panelElement = document.getElementById(panelId);
        if (!panelElement) {
            console.error(`Panel con ID '${panelId}' no encontrado.`);
            return;
        }
        const captureButton = panelElement.querySelector('.capture-button');
        if (captureButton) {
            captureButton.style.visibility = 'hidden';
        }
        try {
            const canvas = await html2canvas(panelElement, {
                useCORS: true,
                scale: 2,
                logging: false,
                allowTaint: true,
            });
            canvas.toBlob(async (blob) => {
                try {
                    await navigator.clipboard.write([
                        new ClipboardItem({ [blob.type]: blob })
                    ]);
                    showToast(`Imagen de "${panelName}" copiada al portapapeles`);
                } catch (err) {
                    console.error('Error al copiar al portapapeles:', err);
                    showToast('Error al copiar la imagen');
                    const link = document.createElement('a');
                    link.download = `${panelName || panelId}.png`;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }, 'image/png');
        } catch (error) {
            console.error('Error al capturar el panel:', error);
            showToast('Error al capturar el panel');
        } finally {
            if (captureButton) {
                captureButton.style.visibility = 'visible';
            }
        }
    }

    // ============ INICIALIZACIÓN ============

    function initApp() {
        // Establecer fecha mínima para los inputs de fecha
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('vacationStart').min = today;
        document.getElementById('vacationEnd').min = today;
        
        // Cargar datos desde Firebase
        loadVacationsFromFirebase();
        loadManualAssignment();
    }

    // Iniciar la aplicación
    initApp();
  </script>
</body>
</html>
